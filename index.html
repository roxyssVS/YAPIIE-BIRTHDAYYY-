<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>A Celestial Journey ✨</title>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&family=Playfair+Display:ital,wght@1,600;1,800&display=swap');

    :root {
      --primary: #f43f5e;
      --gold: #fbbf24;
      --glow: rgba(244, 63, 94, 0.4);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      background: #020208;
      min-height: 100vh;
      overflow-x: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #fff;
    }

    /* Ambient Dynamic Aurora Background */
    canvas#galaxy {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 0;
      pointer-events: none;
    }

    .aurora {
      position: fixed;
      width: 500px;
      height: 500px;
      border-radius: 50%;
      filter: blur(140px);
      opacity: 0.28;
      pointer-events: none;
      z-index: 1;
      animation: pulseAurora 12s infinite alternate ease-in-out;
    }
    .aurora-1 { background: #ec4899; top: -100px; left: -100px; }
    .aurora-2 { background: #6366f1; bottom: -100px; right: -100px; animation-delay: -6s; }

    @keyframes pulseAurora {
      0% { transform: scale(1) translate(0, 0); }
      100% { transform: scale(1.3) translate(60px, 40px); }
    }

    /* Ultra Frosted Glass Card */
    .viewport {
      position: relative;
      z-index: 10;
      width: 92%;
      max-width: 420px;
      perspective: 1000px;
      padding: 10px 0;
    }

    .glass-card {
      background: rgba(18, 18, 28, 0.65);
      border: 1px solid rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(40px);
      -webkit-backdrop-filter: blur(40px);
      border-radius: 32px;
      padding: 34px 28px;
      box-shadow: 0 40px 100px -20px rgba(0,0,0,0.8), inset 0 1px 1px rgba(255,255,255,0.2);
      text-align: center;
      position: relative;
      overflow: hidden;
      transition: transform 0.25s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    /* Shimmer light sweep across card */
    .glass-card::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: linear-gradient(
        45deg,
        transparent 45%,
        rgba(255, 255, 255, 0.06) 50%,
        transparent 55%
      );
      transform: rotate(-25deg);
      animation: sweep 8s infinite linear;
      pointer-events: none;
    }

    @keyframes sweep {
      0% { transform: translateY(-100%) rotate(-25deg); }
      100% { transform: translateY(100%) rotate(-25deg); }
    }

    /* Top tracker dots */
    .stepper {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-bottom: 24px;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.15);
      transition: all 0.4s ease;
    }
    .dot.active {
      background: var(--gold);
      box-shadow: 0 0 12px var(--gold);
      transform: scale(1.3);
      width: 22px;
      border-radius: 12px;
    }

    .pill-tag {
      display: inline-block;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 2px;
      font-weight: 700;
      color: #cbd5e1;
      padding: 6px 14px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 100px;
      margin-bottom: 18px;
    }

    h1.serif-title {
      font-family: 'Playfair Display', serif;
      font-size: 28px;
      font-weight: 800;
      font-style: italic;
      line-height: 1.25;
      margin-bottom: 14px;
      background: linear-gradient(135deg, #fff 40%, #fbcfe8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    p.subtitle {
      font-size: 14px;
      line-height: 1.6;
      color: #94a3b8;
      margin-bottom: 26px;
    }

    /* Quiz buttons with glowing hover state */
    .btn-grid {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 20px;
    }

    .interactive-btn {
      width: 100%;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 18px;
      padding: 16px 20px;
      font-size: 15px;
      font-weight: 600;
      color: #e2e8f0;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      position: relative;
    }

    .interactive-btn:hover {
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(255, 255, 255, 0.3);
      transform: translateY(-2px);
    }

    .interactive-btn.selected {
      background: linear-gradient(135deg, #ec4899 0%, #8b5cf6 100%);
      border-color: transparent;
      box-shadow: 0 10px 30px rgba(236, 72, 153, 0.4);
      color: #fff;
    }

    /* Glowing Primary Action CTA */
    .glow-cta {
      width: 100%;
      background: linear-gradient(135deg, #f43f5e, #ec4899);
      color: white;
      border: none;
      border-radius: 18px;
      padding: 18px;
      font-size: 16px;
      font-weight: 800;
      letter-spacing: 0.5px;
      cursor: pointer;
      box-shadow: 0 10px 35px var(--glow);
      transition: all 0.3s ease;
      margin-top: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .glow-cta:hover {
      transform: scale(1.02);
      box-shadow: 0 15px 45px rgba(244, 63, 94, 0.6);
    }

    /* 3D Gift Box Interactive */
    .gift-stage {
      padding: 30px 0;
      cursor: pointer;
    }
    .gift-box {
      font-size: 78px;
      display: inline-block;
      animation: giftBounce 2s infinite ease-in-out;
      filter: drop-shadow(0 15px 25px rgba(251, 191, 36, 0.4));
      transition: transform 0.3s ease;
    }
    .gift-box:hover {
      transform: scale(1.15) rotate(8deg);
    }
    @keyframes giftBounce {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-16px) rotate(-4deg); }
    }

    /* Polaroid Glass Frame */
    .polaroid {
      background: #ffffff;
      padding: 14px 14px 22px 14px;
      border-radius: 16px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
      transform: rotate(-1.5deg);
      transition: transform 0.3s ease;
      margin-bottom: 20px;
    }
    .polaroid:hover {
      transform: rotate(0deg) scale(1.03);
    }
    .polaroid img {
      width: 100%;
      height: 250px;
      object-fit: cover;
      border-radius: 10px;
      display: block;
    }
    .polaroid-caption {
      font-family: 'Playfair Display', serif;
      font-size: 16px;
      font-weight: 600;
      font-style: italic;
      color: #1e293b;
      margin-top: 12px;
      text-align: center;
    }

    .fade-in-up {
      animation: fadeInUp 0.45s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(20px) scale(0.97); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
  </style>
</head>
<body>

  <canvas id="galaxy"></canvas>
  <div class="aurora aurora-1"></div>
  <div class="aurora aurora-2"></div>

  <div class="viewport">
    <div class="glass-card" id="card">
      <div id="dynamic-content" class="fade-in-up">
        </div>
    </div>
  </div>

  <script>
    // --- SYNTHESIZED AUDIO ENGINE (Instant Zero-Asset Sounds) ---
    const AudioEngine = {
      ctx: null,
      init() {
        if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)();
      },
      playPop() {
        this.init();
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = "sine";
        osc.frequency.setValueAtTime(450, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(850, this.ctx.currentTime + 0.08);
        gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.08);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.08);
      },
      playFanfare() {
        this.init();
        const notes = [523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6
        notes.forEach((freq, idx) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = "triangle";
          osc.frequency.setValueAtTime(freq, this.ctx.currentTime + idx * 0.12);
          gain.gain.setValueAtTime(0.3, this.ctx.currentTime + idx * 0.12);
          gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + idx * 0.12 + 0.6);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(this.ctx.currentTime + idx * 0.12);
          osc.stop(this.ctx.currentTime + idx * 0.12 + 0.6);
        });
      }
    };

    // --- CELESTIAL BACKGROUND PARTICLES ---
    const canvas = document.getElementById("galaxy");
    const ctx = canvas.getContext("2d");
    let stars = [];

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      stars = Array.from({ length: 90 }, () => ({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        radius: Math.random() * 1.5 + 0.5,
        alpha: Math.random() * 0.8 + 0.2,
        speed: Math.random() * 0.4 + 0.1
      }));
    }

    function renderGalaxy() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      stars.forEach(s => {
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.radius, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255, 255, 255, ${s.alpha})`;
        ctx.fill();
        s.y -= s.speed;
        if (s.y < 0) s.y = canvas.height;
      });
      requestAnimationFrame(renderGalaxy);
    }
    window.addEventListener("resize", resizeCanvas);
    resizeCanvas();
    renderGalaxy();

    // --- STORYLINE DATA ---
    const quizSteps = [
      {
        tag: "Protocol Clearance // 01",
        title: "Identify Yourself",
        subtitle: "Answer honestly, the system detects falsehood instantly.",
        options: [
          "The Certified Drama Queen 👑",
          "The Innocent Angel (Big Lie) 😇",
          "The Partner-in-Crime 💣",
          "I demand to speak to my lawyer ⚖️"
        ]
      },
      {
        tag: "Protocol Clearance // 02",
        title: "Conflict Management",
        subtitle: "Given how often we bicker, what's your official resolution plan?",
        options: [
          "Surrender & buy me food 🍕",
          "Argue louder to prove nothing 🗣️",
          "Pretend to be asleep 😴",
          "Accept that I am forever right 🏆"
        ]
      },
      {
        tag: "Final Trial // 03",
        title: "Legal Adulthood Check",
        subtitle: "What miraculous upgrade arrives with turning 18?",
        options: [
          "At least 250g of extra brain capacity 🧠",
          "Treating me to luxury dinners ✨",
          "Zero difference, still a menace 🥊",
          "Voter card aesthetic only 🪪"
        ]
      }
    ];

    const memories = [
      {
        title: "Artifact No. 01 🎞️",
        img: "https://images.unsplash.com/photo-1517841905240-472988babdf9?w=800",
        caption: "Iconic moment: Proof that chaos follows you everywhere."
      },
      {
        title: "A Golden Bouquet 💐",
        img: "https://images.unsplash.com/photo-1561181286-d3fee7d55364?w=800",
        caption: "Virtual flowers that will outlast any argument we ever have."
      }
    ];

    let currentStep = 0;
    let memoryIdx = 0;
    const stage = document.getElementById("dynamic-content");

    function updateDots(activeIdx, total) {
      return `
        <div class="stepper">
          ${Array.from({ length: total }, (_, i) => `
            <div class="dot ${i === activeIdx ? 'active' : ''}"></div>
          `).join('')}
        </div>
      `;
    }

    function renderQuiz() {
      const cur = quizSteps[currentStep];
      stage.className = "fade-in-up";
      stage.innerHTML = `
        ${updateDots(currentStep, quizSteps.length + 2)}
        <div class="pill-tag">${cur.tag}</div>
        <h1 class="serif-title">${cur.title}</h1>
        <p class="subtitle">${cur.subtitle}</p>
        <div class="btn-grid">
          ${cur.options.map(opt => `
            <button class="interactive-btn" onclick="onSelect(this)">
              <span>${opt}</span>
              <span style="opacity:0.3">✦</span>
            </button>
          `).join('')}
        </div>
        <button class="glow-cta" id="quiz-btn" style="display:none;" onclick="onNextQuiz()">
          Continue Journey ➔
        </button>
      `;
    }

    function onSelect(btn) {
      AudioEngine.playPop();
      document.querySelectorAll(".interactive-btn").forEach(b => b.classList.remove("selected"));
      btn.classList.add("selected");
      const cta = document.getElementById("quiz-btn");
      cta.style.display = "flex";
      cta.classList.add("fade-in-up");
    }

    function onNextQuiz() {
      AudioEngine.playPop();
      currentStep++;
      if (currentStep < quizSteps.length) {
        renderQuiz();
      } else {
        renderGiftBox();
      }
    }

    function renderGiftBox() {
      AudioEngine.playFanfare();
      confetti({ particleCount: 70, spread: 80, origin: { y: 0.6 } });
      stage.className = "fade-in-up";
      stage.innerHTML = `
        ${updateDots(quizSteps.length, quizSteps.length + 2)}
        <div class="pill-tag">Clearance Verified</div>
        <h1 class="serif-title">You Unlocked It.</h1>
        <p class="subtitle">Tap the golden vault below to crack open your real message.</p>
        <div class="gift-stage" onclick="openGift()">
          <div class="gift-box">🎁</div>
        </div>
        <p style="font-size:12px; color:#64748b; letter-spacing:1px; text-transform:uppercase;">Tap Box to Open</p>
      `;
    }

    function openGift() {
      AudioEngine.playFanfare();
      // Continuous Fireworks Cannon
      const duration = 2.5 * 1000;
      const end = Date.now() + duration;

      (function frame() {
        confetti({ particleCount: 5, angle: 60, spread: 55, origin: { x: 0 } });
        confetti({ particleCount: 5, angle: 120, spread: 55, origin: { x: 1 } });
        if (Date.now() < end) requestAnimationFrame(frame);
      })();

      renderLetter();
    }

    function renderLetter() {
      stage.className = "fade-in-up";
      stage.innerHTML = `
        ${updateDots(quizSteps.length + 1, quizSteps.length + 2)}
        <div class="pill-tag" style="background: rgba(244,63,94,0.1); color:#fb7185; border-color: rgba(244,63,94,0.3);">Official Proclamation</div>
        <h1 class="serif-title">Happy 18th Birthday! 🥂</h1>
        <div style="text-align: left; font-size: 14.5px; line-height: 1.8; color: #cbd5e1; margin-bottom: 24px;">
          Welcome to absolute freedom and zero legal immunity! May your brain cells finally multiply this year so you can keep up with me.<br><br>
          Jokes aside, I wouldn't trade our relentless fights, dumb jokes, and 2 AM rants for anything. You're irreplaceable. Let's make this chapter iconic.
        </div>
        <button class="glow-cta" onclick="renderMemories()">
          Inspect Confidential Photos 📸
        </button>
      `;
    }

    function renderMemories() {
      AudioEngine.playPop();
      const item = memories[memoryIdx];
      stage.className = "fade-in-up";
      stage.innerHTML = `
        ${updateDots(quizSteps.length + 1, quizSteps.length + 2)}
        <div class="pill-tag">${item.title}</div>
        <div class="polaroid">
          <img src="${item.img}" alt="Memory" />
          <div class="polaroid-caption">${item.caption}</div>
        </div>
        ${
          memoryIdx < memories.length - 1
            ? `<button class="glow-cta" onclick="nextMemory()">Next Archive ➔</button>`
            : `<button class="glow-cta" style="background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.15); box-shadow:none;" onclick="location.reload()">Replay Experience ↺</button>`
        }
      `;
    }

    function nextMemory() {
      memoryIdx++;
      renderMemories();
    }

    // Launch initial stage
    renderQuiz();
  </script>
</body>
</html>
