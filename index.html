 <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>A Magical Birthday Quest ✨🎀</title>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Quicksand:wght@500;700&display=swap');

    :root {
      --lavender-bg: #e6dcfa;
      --card-bg: rgba(255, 255, 255, 0.78);
      --accent-pink: #ff70a6;
      --accent-purple: #9d4edd;
      --ladybug-red: #ff3366;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Fredoka', 'Quicksand', sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      background: linear-gradient(135deg, #e0c3fc 0%, #8ec5fc 50%, #fbc2eb 100%);
      min-height: 100vh;
      overflow-x: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
      position: relative;
    }

    /* Floating Stickers / Charms */
    .sticker-layer {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
      overflow: hidden;
    }

    .sticker {
      position: absolute;
      font-size: 28px;
      opacity: 0.85;
      animation: floatCharm 7s infinite ease-in-out alternate;
    }

    @keyframes floatCharm {
      0% { transform: translateY(0px) rotate(0deg) scale(1); }
      100% { transform: translateY(-30px) rotate(15deg) scale(1.1); }
    }

    .viewport {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 410px;
    }

    .cute-card {
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 3px solid rgba(255, 255, 255, 0.8);
      border-radius: 36px;
      padding: 30px 24px;
      box-shadow: 0 20px 45px rgba(157, 78, 221, 0.2), inset 0 2px 5px rgba(255, 255, 255, 0.6);
      text-align: center;
    }

    .header-icons {
      font-size: 28px;
      margin-bottom: 8px;
      letter-spacing: 4px;
    }

    .stepper {
      display: flex;
      justify-content: center;
      gap: 6px;
      margin-bottom: 16px;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: rgba(157, 78, 221, 0.2);
      transition: all 0.3s ease;
    }

    .dot.active {
      background: var(--accent-pink);
      width: 24px;
      border-radius: 12px;
      box-shadow: 0 0 10px var(--accent-pink);
    }

    .badge {
      display: inline-block;
      font-size: 12px;
      font-weight: 700;
      color: #7209b7;
      background: #f1e4ff;
      border: 1px dashed #b5179e;
      padding: 6px 14px;
      border-radius: 50px;
      margin-bottom: 14px;
    }

    h2.title {
      font-size: 20px;
      font-weight: 700;
      color: #3a0ca3;
      line-height: 1.35;
      margin-bottom: 20px;
    }

    .options {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 18px;
    }

    .option-btn {
      width: 100%;
      background: #ffffff;
      border: 2px solid #ecd6ff;
      border-radius: 20px;
      padding: 15px 18px;
      font-size: 15px;
      font-weight: 600;
      color: #4a4e69;
      cursor: pointer;
      text-align: left;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.03);
      transition: all 0.2s cubic-bezier(0.2, 0.8, 0.2, 1);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .option-btn:hover {
      transform: translateY(-2px);
      border-color: #c77dff;
    }

    .option-btn.selected {
      background: linear-gradient(135deg, #ff70a6, #c77dff);
      color: white;
      border-color: transparent;
      box-shadow: 0 8px 20px rgba(255, 112, 166, 0.35);
    }

    .glow-btn {
      width: 100%;
      background: linear-gradient(135deg, #ff5376, #9d4edd);
      color: white;
      border: none;
      border-radius: 20px;
      padding: 16px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 10px 25px rgba(255, 83, 118, 0.35);
      transition: all 0.2s ease;
      margin-top: 8px;
    }

    .glow-btn:hover {
      transform: scale(1.02);
    }

    /* Photo Frame */
    .cute-frame {
      background: white;
      padding: 12px 12px 18px;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(157, 78, 221, 0.15);
      margin-bottom: 16px;
      border: 2px dashed #f272a1;
    }

    .cute-frame img {
      width: 100%;
      height: 250px;
      object-fit: cover;
      border-radius: 14px;
      display: block;
    }

    .caption {
      margin-top: 10px;
      font-size: 14px;
      font-weight: 600;
      color: #6a0dad;
    }

    .gift-box {
      font-size: 80px;
      cursor: pointer;
      display: inline-block;
      margin: 18px 0;
      animation: pulseBow 1.6s infinite ease-in-out;
      filter: drop-shadow(0 10px 20px rgba(255, 112, 166, 0.3));
    }

    @keyframes pulseBow {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.15) rotate(4deg); }
    }

    .fade-anim {
      animation: fadeIn 0.35s ease forwards;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
  </style>
</head>
<body>

  <div class="sticker-layer">
    <div class="sticker" style="top: 8%; left: 8%;">🎀</div>
    <div class="sticker" style="top: 15%; right: 10%; animation-delay: -2s;">🧚‍♀️</div>
    <div class="sticker" style="top: 45%; left: 4%; animation-delay: -4s;">🐞</div>
    <div class="sticker" style="bottom: 14%; left: 10%; animation-delay: -1s;">✨</div>
    <div class="sticker" style="bottom: 20%; right: 8%; animation-delay: -3s;">🐱</div>
    <div class="sticker" style="top: 75%; right: 12%; animation-delay: -5s;">🌸</div>
  </div>

  <div class="viewport">
    <div class="cute-card">
      <div id="dynamic-content" class="fade-anim"></div>
    </div>
  </div>

  <script>
    // Audio engine for pops & fanfare
    const AudioEngine = {
      ctx: null,
      init() {
        if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)();
      },
      pop() {
        this.init();
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = "sine";
        osc.frequency.setValueAtTime(500, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(900, this.ctx.currentTime + 0.08);
        gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.08);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.08);
      },
      fanfare() {
        this.init();
        [523, 659, 783, 1046].forEach((f, i) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = "triangle";
          osc.frequency.setValueAtTime(f, this.ctx.currentTime + i * 0.1);
          gain.gain.setValueAtTime(0.25, this.ctx.currentTime + i * 0.1);
          gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + i * 0.1 + 0.5);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(this.ctx.currentTime + i * 0.1);
          osc.stop(this.ctx.currentTime + i * 0.1 + 0.5);
        });
      }
    };

    // 5 Theme-Infused Questions
    const questions = [
      {
        tag: "Winx Magic Check 🧚‍♀️",
        icons: "🎀 🌸 ✨",
        title: "If we were in the Winx Club, what kind of fairy are you?",
        options: [
          "Fairy of endless gossiping 💅",
          "Fairy of causing chaos 24/7 🌪️",
          "Fairy of sleeping 12 hours 😴",
          "Stella's twin (high maintenance) 👑"
        ]
      },
      {
        tag: "Miraculous Alert 🐞",
        icons: "🐞 🐱 🖤",
        title: "Hawk Moth sends an Akuma at you... what triggered it?",
        options: [
          "I didn't share my fries with you 🍟",
          "You lost an argument to me 🗣️",
          "Someone woke you up early ⏰",
          "Wi-Fi stopped working for 2 seconds 📶"
        ]
      },
      {
        tag: "Hello Kitty Sanrio Trial 🎀",
        icons: "🎀 🐱 🍰",
        title: "Which Sanrio personality matches you best?",
        options: [
          "Hello Kitty (Cute & bossy) 🎀",
          "Kuromi (Spicy menace) 😈",
          "My Melody (Living in dreamland) 🌸",
          "Cinnamoroll (Soft and sleepy) ☁️"
        ]
      },
      {
        tag: "The Fight Policy 🥊",
        icons: "🥊 🧁 💖",
        title: "Since we fight in every single episode, what’s the fix?",
        options: [
          "You say 'You were right' 5 times 😇",
          "Buy me iced coffee & dessert 🧋",
          "We never stop, it's our signature brand 💅",
          "Call Cat Noir to save us 🐾"
        ]
      },
      {
        tag: "The Legal Age Ceremony 🪪",
        icons: "🎂 🥂 🪄",
        title: "What is your main goal now that you're officially 18?",
        options: [
          "Develop 200g of extra brain power 🧠",
          "Use your Miraculous to pass exams 🪄",
          "Treat me to lunch with adult money 💳",
          "Still act like a toddler 🍼"
        ]
      }
    ];

    const memories = [
      {
        tag: "Iconic Throwback 📸",
        img: "https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=700",
        caption: "A true cinematic masterpiece. Never forget this look!"
      },
      {
        tag: "A Special Bouquet 💐",
        img: "https://images.unsplash.com/photo-1561181286-d3fee7d55364?w=700",
        caption: "Magical Enchantix flowers that will never wither! 🌸"
      }
    ];

    let currentStep = 0;
    let memoryIdx = 0;
    const stage = document.getElementById("dynamic-content");

    function updateDots(activeIdx, total) {
      return `
        <div class="stepper">
          ${Array.from({ length: total }, (_, i) => `
            <div class="dot ${i === activeIdx ? 'active' : ''}"></div>
          `).join('')}
        </div>
      `;
    }

    function renderQuestion() {
      const cur = questions[currentStep];
      stage.className = "fade-anim";
      stage.innerHTML = `
        ${updateDots(currentStep, questions.length + 2)}
        <div class="header-icons">${cur.icons}</div>
        <div class="badge">${cur.tag}</div>
        <h2 class="title">${cur.title}</h2>
        <div class="options">
          ${cur.options.map(opt => `
            <button class="option-btn" onclick="selectOption(this)">
              <span>${opt}</span>
              <span style="opacity:0.4;">✦</span>
            </button>
          `).join('')}
        </div>
        <button class="glow-btn" id="next-btn" style="display:none;" onclick="nextQuestion()">
          Next Magic Trial ➔
        </button>
      `;
    }

    function selectOption(btn) {
      AudioEngine.pop();
      document.querySelectorAll(".option-btn").forEach(b => b.classList.remove("selected"));
      btn.classList.add("selected");
      const nextBtn = document.getElementById("next-btn");
      nextBtn.style.display = "block";
      nextBtn.classList.add("fade-anim");
    }

    function nextQuestion() {
      AudioEngine.pop();
      currentStep++;
      if (currentStep < questions.length) {
        renderQuestion();
      } else {
        renderGiftBox();
      }
    }

    function renderGiftBox() {
      AudioEngine.fanfare();
      confetti({ particleCount: 70, spread: 70, origin: { y: 0.6 } });
      stage.className = "fade-anim";
      stage.innerHTML = `
        ${updateDots(questions.length, questions.length + 2)}
        <div class="header-icons">🎀 🐞 🧚‍♀️</div>
        <div class="badge">Clearance Passed!</div>
        <h2 class="title">Tikki, Spots On! Tap The Bow!</h2>
        <p style="font-size: 14px; color: #6a0dad; margin-bottom: 8px;">Tap the Hello Kitty vault to reveal your wish</p>
        <div class="gift-box" onclick="openBox()">🎁</div>
        <p style="font-size: 12px; color: #b5179e; font-weight:700;">TAP TO UNLOCK ✨</p>
      `;
    }

    function openBox() {
      AudioEngine.fanfare();
      // Multi-burst confetti
      const end = Date.now() + 2000;
      (function frame() {
        confetti({ particleCount: 6, angle: 60, spread: 55, origin: { x: 0 }, colors: ['#ff70a6', '#c77dff', '#ff3366'] });
        confetti({ particleCount: 6, angle: 120, spread: 55, origin: { x: 1 }, colors: ['#ff70a6', '#c77dff', '#ff3366'] });
        if (Date.now() < end) requestAnimationFrame(frame);
      })();

      renderLetter();
    }

    function renderLetter() {
      stage.className = "fade-anim";
      stage.innerHTML = `
        ${updateDots(questions.length + 1, questions.length + 2)}
        <div class="header-icons">🌸 🎂 🧚‍♀️</div>
        <div class="badge" style="background:#ffd1dc; color:#d90429; border-color:#d90429;">Official 18th Wish</div>
        <h2 class="title" style="color: #ff3366; font-size: 24px;">Happy 18th Birthday! 💖</h2>
        <div style="text-align: left; font-size: 14px; line-height: 1.8; color: #4a4e69; margin-bottom: 20px;">
          So you're finally 18! Praying to the Winx fairies that you gain at least 500g of extra brain power so you can finally be as smart as me. 😎<br><br>
          We might argue like Ladybug and Cat Noir 24/7, but honestly, thanks for tolerating me and always sticking around. Have the sweetest day, you menace! 🎀
        </div>
        <button class="glow-btn" onclick="renderMemories()">
          Open The Cute Gallery 📸
        </button>
      `;
    }

    function renderMemories() {
      AudioEngine.pop();
      const item = memories[memoryIdx];
      stage.className = "fade-anim";
      stage.innerHTML = `
        ${updateDots(questions.length + 1, questions.length + 2)}
        <div class="badge">${item.tag}</div>
        <div class="cute-frame">
          <img src="${item.img}" alt="Memory" />
          <div class="caption">${item.caption}</div>
        </div>
        ${
          memoryIdx < memories.length - 1
            ? `<button class="glow-btn" onclick="nextMemory()">Next Picture ➔</button>`
            : `<button class="glow-btn" style="background: white; color: #9d4edd; border: 2px solid #9d4edd; box-shadow:none;" onclick="location.reload()">Replay Magic ↺</button>`
        }
      `;
    }

    function nextMemory() {
      memoryIdx++;
      renderMemories();
    }

    renderQuestion();
  </script>
</body>
</html>
