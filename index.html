 <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Veronicaa Persis // The 18th Multiverse Odyssey ✨🎀</title>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Playfair+Display:ital,wght@1,600;1,800&family=Quicksand:wght@600;700&display=swap');

    :root {
      --lavender: #f1e9ff;
      --lavender-dark: #6b21a8;
      --kitty-pink: #ff6b8b;
      --gold: #ffbe0b;
      --card-bg: rgba(255, 255, 255, 0.92);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Fredoka', 'Quicksand', sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      background: radial-gradient(circle at 50% 20%, #e9d5ff, #d8b4fe 45%, #ffd1dc 90%);
      min-height: 100vh;
      overflow-x: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
      transition: background 1.5s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
    }

    /* Ambient Floating Charms */
    .stickers-board {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 1;
    }
    .charm {
      position: absolute;
      width: 48px;
      height: 48px;
      object-fit: contain;
      opacity: 0.85;
      animation: floatCharm 6s infinite ease-in-out alternate;
    }
    @keyframes floatCharm {
      0% { transform: translateY(0px) rotate(0deg); }
      100% { transform: translateY(-20px) rotate(14deg) scale(1.1); }
    }

    /* Tangled 3D Canvas */
    #lantern-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 2;
      opacity: 0;
      transition: opacity 2s ease;
    }

    .viewport {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 420px;
    }

    .main-card {
      background: var(--card-bg);
      backdrop-filter: blur(28px);
      -webkit-backdrop-filter: blur(28px);
      border: 3.5px solid rgba(255, 255, 255, 0.95);
      border-radius: 36px;
      padding: 28px 22px;
      box-shadow: 0 25px 60px rgba(107, 33, 168, 0.22);
      text-align: center;
      transition: all 0.5s ease;
    }

    .badge {
      display: inline-block;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      padding: 6px 14px;
      border-radius: 50px;
      margin-bottom: 12px;
    }

    h2.title {
      font-size: 20px;
      font-weight: 700;
      color: #2b0938;
      line-height: 1.35;
      margin-bottom: 14px;
    }

    p.subtitle {
      font-size: 14px;
      line-height: 1.6;
      color: #495057;
      margin-bottom: 18px;
    }

    /* Character Showcase Boxes */
    .char-stage {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
      background: #ffffff;
      border-radius: 24px;
      padding: 12px;
      border: 2px solid #ecd6ff;
      box-shadow: 0 8px 20px rgba(0,0,0,0.03);
    }

    .char-img {
      height: 95px;
      object-fit: contain;
      filter: drop-shadow(0 6px 12px rgba(0,0,0,0.15));
      animation: charBob 2.5s infinite ease-in-out alternate;
    }

    @keyframes charBob {
      0% { transform: translateY(0); }
      100% { transform: translateY(-8px); }
    }

    .options-grid {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 16px;
    }

    .btn-opt {
      width: 100%;
      background: #ffffff;
      border: 2px solid #e9d5ff;
      border-radius: 18px;
      padding: 14px 16px;
      font-size: 14px;
      font-weight: 600;
      color: #343a40;
      cursor: pointer;
      text-align: left;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.02);
    }

    .btn-opt:hover {
      transform: translateY(-2px);
      border-color: var(--kitty-pink);
    }

    .btn-opt.selected {
      background: linear-gradient(135deg, var(--kitty-pink), var(--lavender-dark));
      color: white;
      border-color: transparent;
      box-shadow: 0 8px 20px rgba(255, 107, 139, 0.35);
    }

    .action-btn {
      width: 100%;
      background: linear-gradient(135deg, var(--kitty-pink), var(--lavender-dark));
      color: white;
      border: none;
      border-radius: 22px;
      padding: 16px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 10px 25px rgba(255, 107, 139, 0.35);
      transition: all 0.2s ease;
      margin-top: 8px;
    }

    .action-btn:hover {
      transform: scale(1.02);
      box-shadow: 0 12px 30px rgba(255, 107, 139, 0.5);
    }

    .roast-reveal {
      background: #fff0f3;
      border: 2px dashed #ff4d6d;
      border-radius: 18px;
      padding: 14px;
      margin: 14px 0;
      text-align: left;
      animation: popIn 0.3s ease;
    }

    @keyframes popIn {
      from { transform: scale(0.95); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    .coupon-card {
      background: #ffffff;
      border: 2px dashed var(--kitty-pink);
      border-radius: 20px;
      padding: 16px;
      margin-top: 16px;
      text-align: left;
      box-shadow: 0 10px 25px rgba(0,0,0,0.05);
    }

    .fade-anim {
      animation: stageFade 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes stageFade {
      from { opacity: 0; transform: translateY(12px) scale(0.97); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
  </style>
</head>
<body>

  <div class="stickers-board">
    <img src="https://media.tenor.com/7bQy63dK6WAAAAAi/hello-kitty-sanrio.gif" class="charm" style="top: 6%; left: 6%; width: 44px;" alt="Hello Kitty" />
    <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/showdown/25.gif" class="charm" style="top: 14%; right: 8%; width: 42px; animation-delay: -2s;" alt="Pikachu" />
    <img src="https://media.tenor.com/pGZ9BvFf318AAAAi/shin-chan.gif" class="charm" style="top: 45%; left: 4%; width: 48px; animation-delay: -3.5s;" alt="Shinchan" />
    <img src="https://media.tenor.com/f9W5V9H1a3IAAAAi/miraculous-ladybug-tikki.gif" class="charm" style="top: 68%; right: 6%; width: 40px; animation-delay: -1.5s;" alt="Tikki" />
    <img src="https://media.tenor.com/x0qjR2Y9a_4AAAAi/winx-bloom.gif" class="charm" style="bottom: 12%; left: 8%; width: 46px; animation-delay: -4s;" alt="Winx" />
  </div>

  <canvas id="lantern-canvas"></canvas>

  <div class="viewport">
    <div class="main-card" id="card-shell">
      <div id="screen" class="fade-anim"></div>
    </div>
  </div>

  <script>
    const Sound = {
      ctx: null,
      init() {
        if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)();
      },
      beep(f, type="sine", dur=0.08) {
        this.init();
        const o = this.ctx.createOscillator();
        const g = this.ctx.createGain();
        o.type = type;
        o.frequency.setValueAtTime(f, this.ctx.currentTime);
        g.gain.setValueAtTime(0.2, this.ctx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + dur);
        o.connect(g);
        g.connect(this.ctx.destination);
        o.start();
        o.stop(this.ctx.currentTime + dur);
      },
      click() { this.beep(600, "sine", 0.05); },
      wrong() { this.beep(280, "sawtooth", 0.2); },
      tangledMusicBox() {
        const notes = [392, 440, 493.88, 587.33, 659.25, 783.99]; 
        notes.forEach((freq, i) => {
          setTimeout(() => this.beep(freq, "sine", 0.6), i * 220);
        });
      },
      fanfare() {
        [523, 659, 783, 1046].forEach((f, i) => {
          setTimeout(() => this.beep(f, "triangle", 0.4), i * 110);
        });
      }
    };

    let act = 1;
    let shinchanQIdx = 0;
    const screen = document.getElementById("screen");

    function renderAct() {
      screen.className = "fade-anim";

      // ================= ACT 1: REAL POKÉMON BATTLE =================
      if (act === 1) {
        screen.innerHTML = `
          <div class="badge" style="background:#fee2e2; color:#ef4444;">ACT 1 // BATTLE COMMENCE ⚡</div>
          <h2 class="title">Trainer Veronicaa Persis!</h2>
          <p class="subtitle">Team Rocket ambushed you to steal Pikachu! You reached for your Pokéball and summoned your starter: <b>Shorty</b>.</p>
          
          <div class="char-stage">
            <div style="text-align:center;">
              <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/showdown/175.gif" class="char-img" alt="Shorty" />
              <p style="font-size:11px; font-weight:700; color:#6b21a8; margin-top:4px;">Shorty (Lvl 18)</p>
            </div>
            <div style="font-size:20px; font-weight:bold; color:#ff4d6d;">VS</div>
            <div style="text-align:center;">
              <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/showdown/25.gif" class="char-img" alt="Pikachu" />
              <p style="font-size:11px; font-weight:700; color:#d97706; margin-top:4px;">Pikachu (Needs Rescue)</p>
            </div>
          </div>

          <div class="options-grid">
            <button class="btn-opt" onclick="runPokemonMove(1)"><span>Use Shorty's "Baby Tantrum" Cry 🍼</span></button>
            <button class="btn-opt" onclick="runPokemonMove(2)"><span>Order Shorty to Tackle Team Rocket 🥊</span></button>
            <button class="btn-opt" onclick="runPokemonMove(3)"><span>Rescue Pikachu with Veronicaa's Yap Attack 🗣️</span></button>
          </div>
          <div id="poke-response"></div>
        `;
      }

      // ================= ACT 2: REAL SHINCHAN INTERROGATION =================
      else if (act === 2) {
        renderShinchanQuestion();
      }

      // ================= ACT 3: REAL TANGLED 3D SKY SHOW =================
      else if (act === 3) {
        startTangledShow();
      }

      // ================= ACT 4: LOVE & BRAIN-EATING TRUCE =================
      else if (act === 4) {
        renderAct4();
      }
    }

    function runPokemonMove(m) {
      Sound.click();
      const resp = document.getElementById("poke-response");
      confetti({ particleCount: 50, spread: 60, origin: { y: 0.7 } });
      
      let msg = "";
      if (m === 1) msg = "Shorty cried with 10,000 decibels! Team Rocket dropped Pikachu and blasted off!";
      if (m === 2) msg = "Shorty tripped over its own feet and bumped Team Rocket straight into orbit!";
      if (m === 3) msg = "You argued non-stop for 4 straight minutes! Team Rocket apologized and gave Pikachu back!";

      resp.innerHTML = `
        <div class="roast-reveal" style="background:#f3e8ff; border-color:#8338ec;">
          <h4 style="color:#6b21a8; font-size:14px;">Victory! Pikachu is safe.</h4>
          <p style="font-size:13px; color:#4a4e69; margin-top:4px;">${msg}</p>
        </div>
        <button class="action-btn" onclick="act=2; renderAct();">Enter Shinchan's Realm ➔</button>
      `;
    }

    const shinchanQuestions = [
      {
        q: "Shinchan asks: 'Arrey Veronicaa didi! Why are you turning 18 today?'",
        options: [
          "To finally become mature & responsible 😇",
          "Because nature forced me to grow up 🌸",
          "So I can legally boss everyone around 👑"
        ],
        roast: "WRONG! Shinchan says: 'Didi, you only turned 18 so you can eat two cakes at once and complain about back pain!'"
      },
      {
        q: "Shinchan asks: 'Who is clearly the boss in your friendship?'",
        options: [
          "Obviously me, Veronicaa Persis! 💅",
          "We have mutual equal respect 🤝",
          "I refuse to answer without an iced coffee 🧋"
        ],
        roast: "WRONG AGAIN! The actual answer: Neither. One of you is busy eating brains, and the other is suffering peacefully."
      }
    ];

    function renderShinchanQuestion() {
      const item = shinchanQuestions[shinchanQIdx];
      screen.innerHTML = `
        <div class="badge" style="background:#fef3c7; color:#d97706;">ACT 2 // SHINCHAN'S INTERROGATION 🐶</div>
        
        <div style="margin-bottom:12px;">
          <img src="https://media.tenor.com/pGZ9BvFf318AAAAi/shin-chan.gif" style="height:105px; object-fit:contain;" alt="Shinchan Dancing" />
        </div>

        <h2 class="title">${item.q}</h2>
        <div class="options-grid">
          ${item.options.map((opt) => `
            <button class="btn-opt" onclick="handleShinchanChoice('${item.roast.replace(/'/g, "\\'")}')">
              <span>${opt}</span>
            </button>
          `).join('')}
          <button class="btn-opt" style="border: 2px solid #ff70a6; background:#fff0f5;" onclick="triggerLanternShift()">
            <span>"I don't know / IDK" 🤷‍♀️ (Click Here)</span>
          </button>
        </div>
        <div id="shinchan-roast"></div>
      `;
    }

    function handleShinchanChoice(roastText) {
      Sound.wrong();
      const div = document.getElementById("shinchan-roast");
      div.innerHTML = `
        <div class="roast-reveal">
          <p style="font-size:13.5px; color:#be123c; font-weight:600;">❌ ${roastText}</p>
          <p style="font-size:12px; color:#666; margin-top:6px;">Hint: Tap <i>"I don't know / IDK"</i> to break out of this!</p>
        </div>
      `;
    }

    function triggerLanternShift() {
      Sound.click();
      act = 3;
      renderAct();
    }

    // ================= ACT 3: TANGLED 3D LANTERNS & BOAT =================
    function startTangledShow() {
      document.body.style.background = "radial-gradient(circle at 50% 30%, #1a0933 0%, #08031a 70%, #02000d 100%)";
      const card = document.getElementById("card-shell");
      card.style.background = "rgba(18, 10, 35, 0.75)";
      card.style.borderColor = "rgba(255, 190, 11, 0.4)";
      
      const canvas = document.getElementById("lantern-canvas");
      canvas.style.opacity = "1";
      startLanternPhysics();

      Sound.tangledMusicBox();

      let timeLeft = 30;
      screen.innerHTML = `
        <div class="badge" style="background:rgba(255,190,11,0.2); color:#ffbe0b;">ACT 3 // KINGDOM OF CORONA ☀️</div>
        
        <div style="margin: 8px 0;">
          <img src="https://media.tenor.com/Qh0oN6qj0dYAAAAi/tangled-rapunzel.gif" style="width:100%; max-height:165px; object-fit:cover; border-radius:18px; border:2px solid rgba(255,190,11,0.5);" alt="Rapunzel & Flynn" />
        </div>

        <h2 class="title" style="color:#ffbe0b; font-size:21px; margin-top:10px;">At Last You See The Light</h2>
        <p class="subtitle" style="color:#e9d5ff; font-size:14.5px; line-height:1.7;">
          Flynn gently steers the boat, Rapunzel looks straight at you and smiles:<br>
          <span style="font-size:20px; font-weight:700; color:#ffd166; font-family:'Playfair Display',serif; display:inline-block; margin-top:6px;">
            "YAPPIE BIRTHDAY VERONICAA ANI! ✨"
          </span>
        </p>

        <div style="font-size:28px; font-weight:700; color:#ffbe0b; margin: 8px 0;" id="timer-display">30s</div>
        <p style="font-size:12px; color:#cbd5e1;">Watch your lanterns rise into the night sky...</p>
        
        <button class="action-btn" id="skip-act4" style="display:none; background: linear-gradient(135deg, #ffbe0b, #ff70a6); color:#1a0933; font-weight:bold;" onclick="act=4; renderAct();">
          Open Veronicaa's Birthday Letter 💖
        </button>
      `;

      const countdown = setInterval(() => {
        timeLeft--;
        const timerElem = document.getElementById("timer-display");
        if (timerElem) timerElem.innerText = `${timeLeft}s`;
        if (timeLeft <= 0) {
          clearInterval(countdown);
          if (timerElem) timerElem.style.display = "none";
          const skipBtn = document.getElementById("skip-act4");
          if (skipBtn) {
            skipBtn.style.display = "block";
            skipBtn.classList.add("fade-anim");
          }
        }
      }, 1000);
    }

    function startLanternPhysics() {
      const canvas = document.getElementById("lantern-canvas");
      const ctx = canvas.getContext("2d");
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;

      let lanterns = Array.from({ length: 30 }, () => ({
        x: Math.random() * canvas.width,
        y: canvas.height + Math.random() * 200,
        z: Math.random() * 0.8 + 0.4,
        speed: Math.random() * 0.8 + 0.4,
        sway: Math.random() * 2,
        swaySpeed: Math.random() * 0.02 + 0.01
      }));

      function loop() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        lanterns.forEach(l => {
          l.y -= l.speed;
          l.sway += l.swaySpeed;
          const swayX = Math.sin(l.sway) * 15;

          const
